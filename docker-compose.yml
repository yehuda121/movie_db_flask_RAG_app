services:
  web:
    build:
      context: ./movie_flask_app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./movie_flask_app/.env
    volumes:
      # Persist SQLite, FAISS index, and embedding model cache
      - ./movie_flask_app/data:/app/data
      # Persist uploaded movie posters
      - ./movie_flask_app/static/images/posters:/app/static/images/posters
    environment:
      FLASK_DEBUG: "1"
      SECRET_KEY: "change-this-for-learning-only"
      DATABASE_PATH: "/app/data/database.db"
      FAISS_DIR: "/app/data/faiss"
    restart: unless-stopped
