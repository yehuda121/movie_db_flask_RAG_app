{% extends "base.html" %}

{% block title %}Add Movie | MovieDB{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Add New Movie</h1>
    <p>Fill in all fields and upload a poster image.</p>
</section>

<section class="form-section">
    <form class="form-card" method="post" action="{{ url_for('add_movie') }}" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required value="{{ form.get('title', '') }}">
            </div>

            <div class="form-group">
                <label for="slug">Slug (URL)</label>
                <input type="text" id="slug" name="slug" required placeholder="example: the-matrix" value="{{ form.get('slug', '') }}">
            </div>

            <div class="form-group form-group-full">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" required>{{ form.get('description', '') }}</textarea>
            </div>

            <div class="form-group">
                <label for="director">Director</label>
                <input type="text" id="director" name="director" required value="{{ form.get('director', '') }}">
            </div>

            <div class="form-group">
                <label for="release_year">Release Year</label>
                <input type="number" id="release_year" name="release_year" required min="1888" max="2100" value="{{ form.get('release_year', '') }}">
            </div>

            <div class="form-group">
                <label for="actor_1">Actor 1</label>
                <input type="text" id="actor_1" name="actor_1" required value="{{ form.get('actor_1', '') }}">
            </div>

            <div class="form-group">
                <label for="actor_2">Actor 2</label>
                <input type="text" id="actor_2" name="actor_2" required value="{{ form.get('actor_2', '') }}">
            </div>

            <div class="form-group">
                <label for="actor_3">Actor 3</label>
                <input type="text" id="actor_3" name="actor_3" required value="{{ form.get('actor_3', '') }}">
            </div>

            <div class="form-group">
                <label for="actor_4">Actor 4</label>
                <input type="text" id="actor_4" name="actor_4" required value="{{ form.get('actor_4', '') }}">
            </div>

            <div class="form-group form-group-full">
                <label for="poster">Poster Image</label>
                <input type="file" id="poster" name="poster" accept=".png,.jpg,.jpeg,.webp" required>
                <small>Allowed: png, jpg, jpeg, webp</small>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Movie</button>
            <a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
